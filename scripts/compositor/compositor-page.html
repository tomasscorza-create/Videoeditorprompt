<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compositor headless</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script>
// Script clásico y primero a propósito: un fallo al IMPORTAR el módulo no pasa
// por el catch del módulo, así que sin esto el render se queda esperando sin
// ninguna pista de por qué.
function trace(text) { return fetch('./log', { method: 'POST', body: String(text) }); }
window.__trace = trace;
window.addEventListener('error', (event) => {
  trace(`error: ${event.message} @ ${event.filename}:${event.lineno}`);
});
window.addEventListener('unhandledrejection', (event) => {
  trace(`rechazo: ${event.reason && event.reason.stack ? event.reason.stack : event.reason}`);
});
trace('pagina cargada');
</script>
<script type="module">
// Compositor headless de la Fase 3.
//
// Corre el MISMO PixiJS que la vista previa, así el MP4 y lo que ve el usuario
// salen del mismo motor de dibujo.
//
// La página maneja el trabajo completa: pide el plan al servidor local, dibuja
// cada frame y le devuelve el PNG por POST. No hay CDP en el medio. La primera
// versión de esto manejaba Chrome por el protocolo de DevTools y las sesiones se
// caían entre comandos; además, leer el canvas de Pixi da exactamente los píxeles
// dibujados, mientras que una captura de pantalla depende del compositor del
// navegador.

import { Application, Assets, Container, Sprite, Texture } from './pixi.min.mjs';
import { parseVideoTemplateDefinition } from './shared/video-template-definition.js';
import { drawVideoTemplateFrame, prepareVideoTemplate } from './shared/video-template-renderer.js';

/**
 * Las páginas de una plantilla dependen de su definición y de la palabra, no del
 * frame: se componen una sola vez y después cada frame es solo elegir cuál va y
 * volver a dibujar la cámara.
 */
async function prepareTemplates(frames, video) {
  const prepared = new Map();
  for (const frame of frames) {
    for (const template of frame.templates ?? []) {
      const key = `${template.definition}::${template.word}`;
      if (prepared.has(key)) continue;
      const definition = parseVideoTemplateDefinition(await (await fetch(`./${template.definition}`)).json());
      const canvas = document.createElement('canvas');
      canvas.width = video.width;
      canvas.height = video.height;
      prepared.set(key, {
        definition,
        canvas,
        texture: Texture.from(canvas),
        prepared: prepareVideoTemplate(definition, template.word),
      });
    }
  }
  return prepared;
}

async function report(route, body) {
  await fetch(route, { method: 'POST', body });
}

function applyTransform(container, transform) {
  if (transform.kind === 'translate') {
    container.position.set(transform.x, transform.y);
    return;
  }
  // Rotar y escalar alrededor de un punto del lienzo: el pivote y la posición
  // comparten coordenada, que es la forma de girar sobre un punto arbitrario.
  container.pivot.set(transform.x, transform.y);
  container.position.set(transform.x, transform.y);
  if (transform.kind === 'rotate') container.rotation = transform.degrees * Math.PI / 180;
  else container.scale.set(transform.factor);
}

function canvasToPng(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('el canvas no produjo PNG'))), 'image/png');
  });
}

async function run() {
  window.__trace('modulo importado');
  const job = await (await fetch('./job.json')).json();
  window.__trace(`plan recibido: ${job.frames.length} frames`);
  const application = new Application();
  await application.init({
    width: job.video.width,
    height: job.video.height,
    background: job.video.backgroundColor ?? 0,
    backgroundAlpha: job.video.backgroundColor ? 1 : 0,
    antialias: true,
    autoStart: false,
    preference: 'webgl',
    powerPreference: 'low-power',
    // Sin esto el buffer puede quedar vacío al leerlo después de dibujar.
    preserveDrawingBuffer: true,
  });
  document.body.append(application.canvas);
  window.__trace(`pixi listo: ${application.renderer.name}`);
  const root = new Container();
  application.stage.addChild(root);

  const textures = new Map();
  for (const src of [...new Set(job.frames.flatMap((frame) => frame.sprites.map((sprite) => sprite.src)))]) {
    textures.set(src, await Assets.load(src));
  }

  const templates = await prepareTemplates(job.frames, job.video);
  window.__trace(`plantillas preparadas: ${templates.size}`);

  for (const [index, frame] of job.frames.entries()) {
    root.removeChildren();
    // Sprites y plantillas comparten una sola escala de capas para que una
    // plantilla pueda quedar debajo o encima de los personajes según lo que
    // decidió la autoría. Un sprite vale `capa * 1000 + pieza`
    // (`shared/compositor-contract.js`), así que la plantilla usa el mismo
    // múltiplo: con el número crudo caería entre las piezas de dos personajes.
    const layers = [
      ...frame.sprites.map((sprite) => ({ zIndex: sprite.zIndex, sprite })),
      ...(frame.templates ?? []).map((template) => ({ zIndex: template.transform.zIndex * 1000, template })),
    ].sort((left, right) => left.zIndex - right.zIndex);

    for (const layer of layers) {
      if (layer.template) {
        const key = `${layer.template.definition}::${layer.template.word}`;
        const entry = templates.get(key);
        if (!entry) throw new Error(`plantilla sin preparar: ${key}; preparadas: ${[...templates.keys()].join(' | ') || 'ninguna'}`);
        drawVideoTemplateFrame(entry.canvas, entry.prepared, layer.template.seconds);
        entry.texture.source.update();
        const node = new Sprite(entry.texture);
        node.anchor.set(0.5);
        node.position.set(
          job.video.width / 2 + layer.template.transform.x,
          job.video.height / 2 + layer.template.transform.y,
        );
        node.scale.set(layer.template.transform.scale);
        node.rotation = layer.template.transform.rotationDegrees * Math.PI / 180;
        node.alpha = layer.template.transform.opacity;
        root.addChild(node);
        continue;
      }
      const sprite = layer.sprite;
      // La cadena de transformaciones se materializa como contenedores anidados:
      // el de afuera es el primero de la lista, así una pieza hija hereda la
      // rotación de su padre sin recalcular nada.
      let parent = root;
      for (const transform of sprite.transforms) {
        const container = new Container();
        applyTransform(container, transform);
        parent.addChild(container);
        parent = container;
      }
      const node = new Sprite(textures.get(sprite.src));
      node.position.set(0, 0);
      node.alpha = sprite.opacity;
      parent.addChild(node);
    }
    application.render();
    await report(`./frame/${String(index).padStart(4, '0')}`, await canvasToPng(application.canvas));
  }

  await report('./done', JSON.stringify({
    frames: job.frames.length,
    renderer: application.renderer.name ?? 'desconocido',
    width: application.renderer.width,
    height: application.renderer.height,
  }));
}

run().catch(async (error) => {
  // Un fallo del navegador se cuenta con lo que dijo el navegador, no con una
  // adivinanza del lado de Node.
  await report('./error', String(error && error.stack ? error.stack : error));
});
</script>
</body>
</html>
