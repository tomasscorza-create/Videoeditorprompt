name: local-video-infra

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    environment:
      POSTGRES_DB: ${LOCAL_VIDEO_POSTGRES_DB:-local_video}
      POSTGRES_USER: ${LOCAL_VIDEO_POSTGRES_USER:-local_video}
      POSTGRES_PASSWORD: ${LOCAL_VIDEO_POSTGRES_PASSWORD:-local-video-dev-only-change-me}
    ports:
      - "127.0.0.1:${LOCAL_VIDEO_POSTGRES_PORT:-54329}:5432"
    volumes:
      - local_video_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_VIDEO_S3_ACCESS_KEY:-local-video-dev}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_VIDEO_S3_SECRET_KEY:-local-video-dev-only-change-me}
      S3_BUCKET: ${LOCAL_VIDEO_S3_BUCKET:-local-video-private}
    ports:
      - "127.0.0.1:${LOCAL_VIDEO_S3_PORT:-8333}:8333"
    volumes:
      - local_video_seaweed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  local_video_postgres_data:
  local_video_seaweed_data:
