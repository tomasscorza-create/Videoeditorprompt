<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etapa 1 · Escena animada</title>
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <p id="job-meta" class="job-meta" aria-live="polite">Leyendo índice local…</p>
        <div class="controls">
          <button id="play" type="button" class="button-primary" disabled>Reproducir</button>
          <button id="pause" type="button" disabled>Pausar</button>
          <button id="restart" type="button" disabled>Reiniciar</button>
          <a id="download" class="button-link" href="#" download hidden>Descargar MP4</a>
          <button id="theme-toggle" type="button" class="button-icon" aria-label="Cambiar tema" title="Alternar modo claro/oscuro">☀️</button>
        </div>
        <details class="diagnostics">
          <summary>Detalles técnicos</summary>
          <dl class="technical-status">
            <div><dt>Trabajo</dt><dd id="job-status">Pendiente</dd></div>
            <div><dt>Estado</dt><dd id="status" aria-live="polite">Inicializando…</dd></div>
            <div><dt>Renderer</dt><dd id="renderer">Pendiente</dd></div>
            <div class="live"><dt>Tiempo</dt><dd id="time">0.00 s</dd></div>
            <div class="live"><dt>Audio</dt><dd id="audio-status">Detenido</dd></div>
            <div class="live"><dt>Boca</dt><dd id="mouth-status">closed</dd></div>
            <div class="live"><dt>Ojos</dt><dd id="eyes-status">open</dd></div>
            <div class="live"><dt>Gesto</dt><dd id="gesture-status">neutral</dd></div>
          </dl>
        </details>
      </section>
      <section class="canvas-shell" aria-label="Vista previa vertical 1080 por 1920" aria-busy="true">
        <div class="viewer">
          <div id="stage"></div>
          <div id="canvas-loading" class="canvas-loading" role="status">Cargando escena…</div>
          <div class="viewer-bar">
            <span class="viewer-time" id="viewer-current">0:00</span>
            <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" aria-label="Progreso del video" disabled />
            <span class="viewer-time" id="viewer-duration">0:00</span>
          </div>
        </div>
      </section>
      <aside class="sidebar-right">
        <div class="scene-picker">
          <span class="scene-picker-label">Escenas</span>
          <div class="scene-gallery" id="scene-gallery" role="listbox" aria-label="Escenas disponibles">
            <p class="scene-gallery-empty">Cargando escenas…</p>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
