<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etapa 1 · Escena animada</title>
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <p id="job-meta" class="job-meta" aria-live="polite">Leyendo índice local…</p>
        <div class="controls">
          <button id="play" type="button" class="button-primary" disabled>Reproducir</button>
          <button id="pause" type="button" disabled>Pausar</button>
          <button id="restart" type="button" disabled>Reiniciar</button>
          <a id="download" class="button-link" href="#" download hidden>Descargar MP4</a>
        </div>
        <details class="diagnostics">
          <summary>Detalles técnicos</summary>
          <dl class="technical-status">
            <div><dt>Trabajo</dt><dd id="job-status">Pendiente</dd></div>
            <div><dt>Estado</dt><dd id="status" aria-live="polite">Inicializando…</dd></div>
            <div><dt>Renderer</dt><dd id="renderer">Pendiente</dd></div>
            <div class="live"><dt>Tiempo</dt><dd id="time">0.00 s</dd></div>
            <div class="live"><dt>Audio</dt><dd id="audio-status">Detenido</dd></div>
            <div class="live"><dt>Boca</dt><dd id="mouth-status">closed</dd></div>
            <div class="live"><dt>Ojos</dt><dd id="eyes-status">open</dd></div>
            <div class="live"><dt>Gesto</dt><dd id="gesture-status">neutral</dd></div>
          </dl>
        </details>
      </section>
      <section class="canvas-shell" aria-label="Vista previa vertical 1080 por 1920" aria-busy="true">
        <div class="viewer">
          <div id="stage"></div>
          <div id="canvas-loading" class="canvas-loading" role="status">Cargando escena…</div>
          <div class="viewer-bar">
            <button id="viewer-play-btn" class="viewer-control-btn" title="Reproducir/Pausar" disabled>
              <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <span class="viewer-time" id="viewer-current">0:00</span>
            <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" aria-label="Progreso del video" disabled />
            <span class="viewer-time" id="viewer-duration">0:00</span>
            <button id="speed-btn" class="viewer-control-btn" title="Velocidad: 1x">1x</button>
            <button id="loop-btn" class="viewer-control-btn" title="Bucle automático">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>
          </div>
        </div>
      </section>
      <aside class="sidebar-right">
        <div class="scene-picker">
          <span class="scene-picker-label">Escenas</span>
          <div class="scene-gallery" id="scene-gallery" role="listbox" aria-label="Escenas disponibles">
            <p class="scene-gallery-empty">Cargando escenas…</p>
          </div>
        </div>
      </aside>
    </main>

    <button id="settings-open" class="button-icon settings-button" aria-label="Configuración" title="Configuración">⚙️</button>
    
    <dialog id="settings-modal" class="modal">
      <div class="modal-content">
        <header class="modal-header">
          <h2>Configuración</h2>
          <button id="settings-close" class="button-icon" aria-label="Cerrar modal">✖</button>
        </header>
        <div class="modal-body">
          <div class="setting-item">
            <label for="theme-select">Tema visual</label>
            <select id="theme-select" class="select-input">
              <option value="system">Sistema</option>
              <option value="light">Claro</option>
              <option value="dark">Oscuro</option>
            </select>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
